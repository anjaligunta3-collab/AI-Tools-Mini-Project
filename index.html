
<!DOCTYPE html>
<html>
<head>
  <title>AI Tools Mini Project</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f0f7f4;
      padding: 30px;
    }
    .card {
      background: white;
      padding: 25px;
      margin: 15px auto;
      max-width: 350px;
      border-radius: 15px;
      box-shadow: 0 3px 10px #cccccc;
    }
    button {
      background: #16845b;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>🤖 AI Tools Mini Project</h1>
  <p>Welcome! Explore popular AI tools.</p>

  <div class="card">
    <h2>ChatGPT</h2>
    <p>Learn, write and explore coding ideas.</p>
    <button onclick="showInfo('ChatGPT')">Explore</button>
  </div>

  <div class="card">
    <h2>Google Gemini</h2>
    <p>Explore AI assistance and learning.</p>
    <button onclick="showInfo('Google Gemini')">Explore</button>
  </div>

  <div class="card">
    <h2>Microsoft Copilot</h2>
    <p>Explore AI tools for productivity.</p>
    <button onclick="showInfo('Microsoft Copilot')">Explore</button>
  </div>

  <p id="result"></p>

  <script>
    function showInfo(tool) {
      document.getElementById("result").innerText =
        "You selected " + tool + "!";
    }
  </script>
</body>
</html>
